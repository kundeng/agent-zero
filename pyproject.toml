[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperagent0"
version = "0.1.0.dev0"
description = "HyperAgent Zero — host-first agentic harness forked from agent0ai/agent-zero"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "HyperAgent Zero contributors" },
]
keywords = ["agent", "llm", "agentic", "claude", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
# Spec 02: opt-in Claude Agent SDK provider. Base wheel does not depend on these;
# `anthropic` MUST NOT be imported unless chat_model_provider=claude-sdk is selected.
claude-sdk = [
    "anthropic>=0.40",
    "claude-agent-sdk",
]
# Spec 05: container-spawning sandbox modes. Lazy-imported in their backends.
docker = ["docker>=7"]
podman = ["podman>=4"]
telegram = ["python-telegram-bot>=21"]
slack = ["slack-bolt>=1.18"]
discord = ["discord.py>=2.3"]
channels = [
    "python-telegram-bot>=21",
    "slack-bolt>=1.18",
    "discord.py>=2.3",
]
all = [
    "anthropic>=0.40",
    "claude-agent-sdk",
    "docker>=7",
    "podman>=4",
    "python-telegram-bot>=21",
    "slack-bolt>=1.18",
    "discord.py>=2.3",
]
# Test + lint dependencies. ``pip install -e .[dev]`` for contributors.
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
]

[project.scripts]
# Two binaries, same Click group. See spec 03 D5 (lazy subcommand loading).
hyperagent0 = "hyperagent0.cli:main"
haz = "hyperagent0.cli:main"

[project.urls]
Homepage = "https://github.com/kundeng/hyperagent-zero"
Repository = "https://github.com/kundeng/hyperagent-zero"

# ---------------------------------------------------------------------------
# setuptools configuration
#
# Per spec 01-host-first D9: ship the new wrapper package `hyperagent0/` AND
# the unchanged upstream-mirrored `python/` tree in the same wheel. This is
# a transitional layout — eventually upstream code may migrate under
# `hyperagent0/` but for now we preserve cherry-pick ergonomics.
# ---------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# Only ship our wrapper package in the wheel. The upstream ``python/``
# package MUST NOT be bundled: its code does
# ``Path(__file__).parent.parent / "conf"`` to find runtime assets, so a
# copy in site-packages would resolve to site-packages/conf/ (empty).
# Instead, install.sh clones the repo to ~/.hyperagent0/repo and drops
# a .pth file that puts that path on sys.path, so the live ``python/``
# package the daemon imports is the one in the repo — with conf/,
# prompts/, agents/, knowledge/, ... reachable as siblings.
include = ["hyperagent0*"]
exclude = ["tests*", "logs*", "tmp*", "usr*", "webui*", "docker*", "docs*", "python*"]

[tool.setuptools.dynamic]
# Upstream split requirements into requirements.txt + requirements2.txt
# (commit 7081479). They install them sequentially in install_A0.sh because
# requirements2.txt's openai==1.99.5 conflicts with browser-use 0.5.11's
# transitive openai==1.99.2 pin, and only sequential install (where each
# step is independently resolved) lets the newer openai override the older
# transitive pin. We bundle only requirements.txt here; users / packagers
# install requirements2.txt as a second step. See specs/01-host-first
# log entries for the long-form discussion. Our wrapper's own deps (click)
# live in a clearly-marked block at the bottom of requirements.txt.
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
