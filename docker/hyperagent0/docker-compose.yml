# HyperAgent Zero — compose deployment. See README.md "Scenario D" for the
# end-to-end walkthrough. Copy ``.env.example`` to ``.env`` next to this file
# (or set env vars in your shell) before ``docker compose up``.
#
#   docker compose -f docker/hyperagent0/docker-compose.yml up -d
#   docker compose -f docker/hyperagent0/docker-compose.yml logs -f
#   docker compose -f docker/hyperagent0/docker-compose.yml down

services:
  hyperagent0:
    image: bayeslearner/hyperagent0:latest
    # Uncomment to build from local source instead of pulling the published
    # image. The build context is the repo root, two dirs up from this file.
    # build:
    #   context: ../..
    #   dockerfile: docker/hyperagent0/Dockerfile
    container_name: hyperagent0
    restart: unless-stopped
    ports:
      - "${HYPERAGENT0_PORT:-50080}:50080"
    volumes:
      # Persistent state: vector memory, project data, daemon logs.
      - hyperagent0_memory:/app/memory
      - hyperagent0_usr:/app/usr
      - hyperagent0_logs:/app/logs
      # Uncomment to let the agent's docker-sandbox backend (spec 05) spawn
      # sibling containers on the host. Requires the host to allow socket
      # mounts; consider rootless docker / podman if that's a concern.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WEB_UI_HOST: "0.0.0.0"
      WEB_UI_PORT: "50080"
      # The agent reads these on startup and writes them into settings.json
      # ONLY when the field isn't already set — restart doesn't clobber a
      # value picked via the web UI. See .env.example for the full list.
      CHAT_MODEL_PROVIDER: "${CHAT_MODEL_PROVIDER:-}"
      CHAT_MODEL_NAME: "${CHAT_MODEL_NAME:-}"
      CHAT_MODEL_API_BASE: "${CHAT_MODEL_API_BASE:-}"
      SANDBOX_MODE: "${SANDBOX_MODE:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

volumes:
  hyperagent0_memory:
  hyperagent0_usr:
  hyperagent0_logs:
